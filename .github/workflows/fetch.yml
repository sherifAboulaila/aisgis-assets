name: fetch-assets
on:
  push:
    paths: [urls.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p vo img
          while read -r path url; do
            [ -z "$path" ] && continue
            curl -fsSL --retry 3 -o "$path" "$url"
            ls -l "$path"
          done < urls.txt
      - name: Commit
        run: |
          git config user.name "assets-bot"
          git config user.email "assets-bot@users.noreply.github.com"
          git add vo img
          git commit -m "Add AIS vs GIS voice and images"
          git push
